# Nginx 配置示例（HTTPS 证书用 certbot --nginx 自动补全）
server {
    listen 80;
    server_name picker.taouuuuuu.tech;

    root /opt/name-picker;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # 静态资源缓存
    location ~* \.(css|js|png|jpg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript text/csv;
}
